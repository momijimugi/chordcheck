<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>WorksDB スケジュールボード</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Load Inter font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/schedule-board.css">
  <link rel="stylesheet" href="css/buttons.css">
</head>
<body class="theme-dark">

  <div class="app-shell">
    
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="app-title">
        <h1>WorksDB</h1>
        <p>一括スケジュール・ボード</p>
      </div>
      
      <div class="section-label">検索フィルター</div>
      <input type="text" id="search-tracks-input" class="input-text" placeholder="曲名で検索...">
      
      <div class="section-label">表示切替</div>
      <div style="display: flex; gap: 4px;">
        <button type="button" id="btn-filter-all" class="btn btn-toggle active" style="flex: 1;">全体</button>
        <button type="button" id="btn-filter-selected" class="btn btn-toggle" style="flex: 1;">選択案件のみ</button>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="section-label" style="margin: 0; border: none; padding: 0;">案件リスト</div>
        <button type="button" id="btn-add-project" class="btn btn-icon-sm" title="案件を追加">+</button>
      </div>
      <div id="project-list-container" class="project-list">
        <!-- JS Dyn -->
      </div>

      <!-- ADD ROW BUTTON IN SIDEBAR -->
      <button type="button" id="btn-add-row-sidebar" class="btn btn-primary" style="width: 100%; font-size: 0.75rem; gap: 6px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        行（曲）を追加
      </button>
      
      <!-- INLINE STATUS PALETTE -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
        <div class="section-label" style="margin: 0; border: none; padding: 0;">予定項目パレット</div>
      </div>
      <div id="status-sidebar-list" class="status-sidebar-list">
        <!-- JS Dyn -->
      </div>
      <div style="display: flex; gap: 4px;">
        <input type="text" id="input-new-status-name" class="input-text" placeholder="新規項目名..." style="flex: 1; padding: 4px 8px; font-size: 0.72rem;">
        <input type="color" id="input-new-status-color" value="#0284c7" style="width: 26px; height: 26px; border: 1px solid var(--border-color); border-radius: 4px; padding: 0; cursor: pointer; flex-shrink: 0;">
        <button type="button" id="btn-add-status-quick" class="btn btn-primary" style="padding: 4px 8px; font-size: 0.72rem; font-weight: bold;">追加</button>
      </div>

      <!-- SIDEBAR SETTINGS BUTTONS -->
      <div class="section-label">設定</div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <button type="button" id="btn-open-grid-settings" class="btn" style="width: 100%; font-size: 0.75rem; justify-content: flex-start; gap: 6px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
          表示サイズ・表示日数...
        </button>
        <button type="button" id="btn-open-webapp-settings" class="btn btn-primary" style="width: 100%; font-size: 0.75rem; justify-content: flex-start; gap: 6px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          スプレッドシート連携...
        </button>
      </div>
    </aside>

    <!-- MAIN PANEL -->
    <main class="main">
      
      <!-- TOP STATUS BAR -->
      <header class="top-bar">
        <div class="top-left">
          <div class="led-bar" id="sync-status-bar" title="クリックで連携設定を開く">
            <span id="sync-led" class="led-dot synced"></span>
            <span id="sync-text">ローカル保存モード</span>
          </div>
          <span id="sheet-info-label" style="font-size: 0.72rem; color: var(--text-muted);">
            スプレッドシート未連携
          </span>
        </div>
        <div class="top-right">
          <button type="button" id="btn-add-row-top" class="btn btn-primary" title="新しい行（曲）を追加">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            行を追加
          </button>
          <button type="button" id="btn-toggle-theme" class="btn" title="表示テーマ切り替え">
            <span id="theme-btn-icon"></span> <span id="theme-btn-label">ダーク</span>
          </button>
          <button type="button" id="btn-jump-today" class="btn" title="今日へジャンプ">今日</button>
          <button type="button" id="btn-undo" class="btn" title="元に戻す (Ctrl+Z)" disabled>戻す</button>
          <button type="button" id="btn-redo" class="btn" title="やり直す (Ctrl+Y)" disabled>進む</button>
          <button type="button" id="btn-copy-gas" class="btn" title="GASコード生成">GASコード</button>
          <button type="button" id="btn-sync-now" class="btn" title="手動更新">更新</button>
        </div>
      </header>

      <!-- DATA GRID CONTAINER -->
      <section class="grid-shell">
        <div id="grid-loading" class="overlay hidden" style="position: absolute; background: rgba(0,0,0,0.3);">
          <div style="text-align: center; color: var(--cyan); font-weight: bold; font-size: 0.85rem;">
            読み込み中...
          </div>
        </div>
        
        <div id="grid-wrapper" class="grid-wrapper">
          <div class="grid-split">
            <!-- Left Pane -->
            <div id="gridLeftPane" class="grid-left">
              <table class="schedule-grid" id="table-left">
                <thead>
                  <tr>
                    <th class="row-header-cell">
                      <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span>案件 / 曲名</span>
                        <button type="button" id="btn-add-row-grid-head" class="btn btn-primary" style="padding: 1px 6px; font-size: 0.65rem;" title="新規行を追加">+ 行追加</button>
                      </div>
                    </th>
                  </tr>
                </thead>
                <tbody id="tbody-left">
                  <!-- JS Gen -->
                </tbody>
              </table>
            </div>
            
            <!-- Right Pane -->
            <div id="gridRightPane" class="grid-right">
              <table class="schedule-grid schedule-grid-right" id="table-right">
                <thead id="thead-right">
                  <!-- JS Gen -->
                </thead>
                <tbody id="tbody-right">
                  <!-- JS Gen -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
      
    </main>

  </div>

  <!-- CONTEXT MENU (RIGHT CLICK) -->
  <div id="contextMenu" class="context-menu hidden">
    <div class="context-menu-item" data-action="status-select">予定項目を変更...</div>
    <div style="height: 1px; background: var(--border-color); margin: 2px 0;"></div>
    <div class="context-menu-item" data-action="add-row">+ 新しい行を追加</div>
    <div class="context-menu-item" data-action="copy">コピー <span style="margin-left: auto; opacity: 0.5;">Ctrl+C</span></div>
    <div class="context-menu-item" data-action="paste">貼り付け <span style="margin-left: auto; opacity: 0.5;">Ctrl+V</span></div>
    <div class="context-menu-item" data-action="clear">消去 <span style="margin-left: auto; opacity: 0.5;">Delete</span></div>
    <div style="height: 1px; background: var(--border-color); margin: 2px 0;"></div>
    <div class="context-menu-item" data-action="note">予定メモを編集...</div>
  </div>

  <!-- MODAL: QUICK STATUS SELECTOR DIALOG -->
  <div id="dlg-status-selector" class="overlay hidden">
    <div class="dialog">
      <div class="dialog-header">
        <h3>予定項目の選択</h3>
        <button type="button" class="btn btn-close-dialog">&times;</button>
      </div>
      <div class="dialog-body">
        <div style="font-size: 0.72rem; color: var(--text-muted);">
          選択したセルに適用する項目を選択してください：
        </div>
        <div id="status-dialog-list" style="display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto;">
          <!-- JS Dyn -->
        </div>
      </div>
      <div class="dialog-footer">
        <button type="button" id="btn-clear-status-dialog" class="btn btn-primary" style="background: var(--danger); margin-right: auto;">クリア (空欄)</button>
        <button type="button" class="btn btn-close-dialog">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- MODAL: GRID DISPLAY SETTINGS -->
  <div id="dlg-grid-settings" class="overlay hidden">
    <div class="dialog">
      <div class="dialog-header">
        <h3>表示サイズ・表示日数設定</h3>
        <button type="button" class="btn btn-close-dialog">&times;</button>
      </div>
      <div class="dialog-body">
        <div class="form-group">
          <label for="cfg-cell-width">セル幅 (px)</label>
          <input type="number" id="cfg-cell-width" value="76" min="40" max="150">
        </div>
        <div class="form-group">
          <label for="cfg-cell-height">セル高 (px)</label>
          <input type="number" id="cfg-cell-height" value="28" min="20" max="60">
        </div>
        <div class="form-group">
          <label for="cfg-days-to-show">表示日数 (日)</label>
          <input type="number" id="cfg-days-to-show" value="180" min="7" max="365">
        </div>
      </div>
      <div class="dialog-footer">
        <button type="button" id="btn-save-grid-settings" class="btn btn-primary">適用</button>
      </div>
    </div>
  </div>

  <!-- MODAL: WEBAPP SETTINGS -->
  <div id="dlg-webapp" class="overlay hidden">
    <div class="dialog">
      <div class="dialog-header">
        <h3>Google スプレッドシート連携</h3>
        <button type="button" class="btn btn-close-dialog">&times;</button>
      </div>
      <div class="dialog-body">
        <div class="form-group">
          <label for="fld-spreadsheet-id">スプレッドシートID</label>
          <input type="text" id="fld-spreadsheet-id" placeholder="スプレッドシートのIDを入力">
        </div>
        <div class="form-group">
          <label for="fld-webapp-url">Google Apps Script ウェブアプリ URL</label>
          <input type="text" id="fld-webapp-url" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
      </div>
      <div class="dialog-footer">
        <button type="button" id="btn-test-health" class="btn">接続テスト</button>
        <button type="button" id="btn-save-webapp" class="btn btn-primary">設定を保存</button>
      </div>
    </div>
  </div>

  <!-- ADD PROJECT DIALOG -->
  <div id="dlg-project" class="overlay hidden">
    <div class="dialog">
      <div class="dialog-header">
        <h3 id="dlg-project-title">新しい案件の追加</h3>
        <button type="button" class="btn btn-close-dialog">&times;</button>
      </div>
      <div class="dialog-body">
        <input type="hidden" id="fld-proj-id">
        <div class="form-group">
          <label for="fld-proj-name">案件名</label>
          <input type="text" id="fld-proj-name" placeholder="案件名を入力">
        </div>
        <div class="form-group">
          <label for="fld-proj-color">案件テーマカラー</label>
          <input type="color" id="fld-proj-color" value="#3b82f6" style="height: 38px; width: 100%; padding: 2px; cursor: pointer;">
        </div>
      </div>
      <div class="dialog-footer">
        <button type="button" id="btn-save-project" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- ADD TRACK / ROW DIALOG -->
  <div id="dlg-track" class="overlay hidden">
    <div class="dialog">
      <div class="dialog-header">
        <h3 id="dlg-track-title">行（曲）の追加</h3>
        <button type="button" class="btn btn-close-dialog">&times;</button>
      </div>
      <div class="dialog-body">
        <input type="hidden" id="fld-track-old-name">
        <div class="form-group" id="fld-track-proj-select-group">
          <label for="fld-track-proj-select">対象案件</label>
          <select id="fld-track-proj-select"></select>
        </div>
        <div class="form-group">
          <label for="fld-track-name">曲名 / トラック名</label>
          <input type="text" id="fld-track-name" placeholder="曲名を入力">
        </div>
        <div class="form-group">
          <label for="fld-track-memo">メモ / 概要</label>
          <textarea id="fld-track-memo" rows="3" placeholder="メモを入力"></textarea>
        </div>
      </div>
      <div class="dialog-footer">
        <button type="button" id="btn-save-track" class="btn btn-primary">追加</button>
      </div>
    </div>
  </div>

  <!-- CELL NOTE DIALOG -->
  <div id="dlg-cell-note" class="overlay hidden">
    <div class="dialog">
      <div class="dialog-header">
        <h3>予定の個別メモ編集</h3>
        <button type="button" class="btn btn-close-dialog">&times;</button>
      </div>
      <div class="dialog-body">
        <input type="hidden" id="fld-note-track-id">
        <input type="hidden" id="fld-note-date">
        <div style="font-size: 0.72rem; color: var(--text-muted); margin-bottom: 8px;">
          対象: <span id="note-track-label"></span> (<span id="note-date-label"></span>)
        </div>
        <div class="form-group">
          <label for="fld-cell-note-text">予定メモ</label>
          <textarea id="fld-cell-note-text" rows="3" placeholder="この日の特記事項を入力"></textarea>
        </div>
      </div>
      <div class="dialog-footer">
        <button type="button" id="btn-save-cell-note" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- GAS TEMPLATE DIALOG -->
  <div id="dlg-gas-code" class="overlay hidden">
    <div class="dialog" style="max-width: 540px;">
      <div class="dialog-header">
        <h3>Apps Script コード生成</h3>
        <button type="button" class="btn btn-close-dialog">&times;</button>
      </div>
      <div class="dialog-body">
        <textarea id="txt-gas-code" readonly rows="12" style="font-family: monospace; font-size: 0.7rem; background: rgba(0,0,0,0.1); color: var(--cyan); width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; outline: none; resize: none;"></textarea>
      </div>
      <div class="dialog-footer">
        <button type="button" id="btn-copy-gas-clipboard" class="btn btn-primary">コピー</button>
      </div>
    </div>
  </div>

  <!-- APPLICATION CODE -->
  <script src="js/schedule-board.js"></script>

</body>
</html>
