<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="rgba(111,214,255,0.2)" stroke-width="1.5"/>

  <!-- Database Cylinder Layer 1 (Top) -->
  <ellipse cx="32" cy="18" rx="17" ry="6.5" fill="#132238" stroke="#6fd6ff" stroke-width="2.5" filter="url(#glowCyan)"/>
  
  <!-- Database Cylinder Layer 2 (Middle) -->
  <path d="M 15 18 v 12 c 0 3.6 7.6 6.5 17 6.5 s 17 -2.9 17 -6.5 V 18" fill="none" stroke="#6fd6ff" stroke-width="2.5"/>
  <ellipse cx="32" cy="30" rx="17" ry="6.5" fill="rgba(111,214,255,0.06)" stroke="#6fd6ff" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Database Cylinder Layer 3 (Bottom) -->
  <path d="M 15 30 v 12 c 0 3.6 7.6 6.5 17 6.5 s 17 -2.9 17 -6.5 V 30" fill="none" stroke="#ffb347" stroke-width="2.5"/>
  <ellipse cx="32" cy="42" rx="17" ry="6.5" fill="rgba(255,179,71,0.1)" stroke="#ffb347" stroke-width="1.5"/>

  <!-- Glowing Audio Wave / Timeline Matrix Accent -->
  <path d="M 6 36 C 14 26 18 46 26 24 C 32 10 38 42 46 28 C 52 18 56 34 60 32" fill="none" stroke="#ffb347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
